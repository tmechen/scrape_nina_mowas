name: Scrape latest data

on:
  push:
  workflow_dispatch:
  schedule:
    - cron:  '6,26,46 * * * *'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v4
    - name: Fetch latest data
      run: |-
        # api33 (NINA-App ab 3.7) bevorzugt, api31 als Rückfall; nur eine gültige Liste wird übernommen
        for gen in api33 api31; do
          if curl -fsS --retry 2 "https://warnung.bund.de/$gen/mowas/mapData.json" -o raw.json && jq -e 'type == "array"' raw.json > /dev/null; then
            jq . raw.json > mowas.json && break
          fi
        done
        rm -f raw.json
    - name: Commit and push if it changed
      run: |-
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Latest data: ${timestamp}" || exit 0
        git push
